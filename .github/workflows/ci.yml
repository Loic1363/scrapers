name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m py_compile run.py web.py scrapers/*.py

      - run: python -c "from scrapers import facebook, deuxiememain, vinted, suspects, logdb, config"
